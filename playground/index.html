<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Review</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-bar">
  <div class="app-bar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-name">Commit Review</span>
    </div>
  </div>
</header>

<div class="page">

  <div class="page-header">
    <h1>Commit Review</h1>
    <p class="subtitle">Review a single commit before it merges.</p>
  </div>

  <form id="review-form" class="review-form" autocomplete="off">
    <div class="field">
      <label for="repository-url">Repository URL</label>
      <input
        id="repository-url"
        name="repository-url"
        type="text"
        placeholder="https://github.com/pallets/click"
        required
        autofocus
      >
    </div>

    <div class="field-row">
      <div class="field field-grow">
        <label for="commit-hash">Commit hash <span class="optional">(optional)</span></label>
        <input
          id="commit-hash"
          name="commit-hash"
          type="text"
          placeholder="Defaults to the latest commit"
        >
      </div>
      <div class="field field-action">
        <button id="submit-button" type="submit">Review Commit</button>
      </div>
    </div>
  </form>

  <main id="output" class="output" aria-live="polite">
    <div class="empty-state">
      <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="idle-hint">Enter a repository URL and click Review Commit to get started.</p>
    </div>
  </main>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
