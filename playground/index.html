<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Review</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header class="page-header">
    <h1>Commit Review</h1>
    <p class="subtitle">Enter a repository and commit to generate a review.</p>
  </header>

  <form id="review-form" class="review-form" autocomplete="off">
    <div class="field">
      <label for="repository-url">Repository URL</label>
      <input
        id="repository-url"
        name="repository-url"
        type="text"
        placeholder="https://github.com/pallets/click"
        required
        autofocus
      >
    </div>

    <div class="field-row">
      <div class="field field-grow">
        <label for="commit-hash">Commit hash <span class="optional">(optional)</span></label>
        <input
          id="commit-hash"
          name="commit-hash"
          type="text"
          placeholder="Defaults to the latest commit"
        >
      </div>
      <div class="field field-action">
        <button id="submit-button" type="submit">Review Commit</button>
      </div>
    </div>
  </form>

  <main id="output" class="output" aria-live="polite">
    <p class="idle-hint">Enter a repository URL and click Review Commit to get started.</p>
  </main>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
